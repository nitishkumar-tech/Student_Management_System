<div class="register-container">

  <div class="register-card">

    <div class="logo">
      🎓
    </div>

    <h2>Create Account</h2>

    <p class="subtitle">
      Register for Student Management System
    </p>


    <div class="mb-3">

      <label class="form-label">
        Name
      </label>

      <input
        type="text"
        class="form-control"
        placeholder="Enter your name"
        [(ngModel)]="name">

    </div>


    <div class="mb-3">

      <label class="form-label">
        Email
      </label>

      <input
        type="email"
        class="form-control"
        placeholder="Enter your email"
        [(ngModel)]="email">

    </div>


    <div class="mb-3">

      <label class="form-label">
        Password
      </label>

      <input
        type="password"
        class="form-control"
        placeholder="Enter your password"
        [(ngModel)]="password">

    </div>


    <button
      type="button"
      class="btn btn-primary w-100"
      (click)="register()">

      Register

    </button>


    <p class="login-text">

      Already have an account?

      <a routerLink="/login">
        Login
      </a>

    </p>

  </div>

</div>
